# Minimal environment for this repository, taken from the one that produced
# the paper (conda env "dedalus3" on IGAM12WS, exported 2026-10-29).
# Packages used only by other projects (PyTorch, DeepXDE, SunPy, ...) are left out.
#
#   conda env create -f environment.yml
#   conda activate closed-form-hd
#   CC=mpicc pip install --no-cache --no-build-isolation dedalus==3.0.4
#
# Dedalus is installed with pip in a second step, as in the paper's environment;
# see https://dedalus-project.readthedocs.io for platform-specific notes.
name: closed-form-hd
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.2.6
  - scipy=1.16.2
  - h5py=3.14.0
  - hdf5=1.14.6
  - mpi4py=4.1.0
  - openmpi=5.0.8
  - fftw=3.3.10
  - cython=3.1.3
  - c-compiler
  - cxx-compiler
  - matplotlib=3.10.8
  - sympy=1.14.0
  - pip
